[filter "mypy "]
strip_ansi = true
match_line = "error:" unless "Found "
max_lines = 60
on_empty = "mypy: no issues found"
test_input = "src/a.py:12: error: Incompatible return value type\nsrc/b.py:4: note: see here\nFound 1 error in 1 file (checked 22 source files)"
test_expect = "src/a.py:12: error: Incompatible return value type\nFound 1 error in 1 file (checked 22 source files)"

[filter "basedpyright "]
strip_ansi = true
match_line = "- error:" unless " errors, "
max_lines = 60
on_empty = "basedpyright: no issues found"
test_input = "  /repo/a.py:3:1 - error: Import could not be resolved\n  /repo/a.py:9:5 - warning: Unused variable\n0 errors, 1 warning, 0 notes"
test_expect = "  /repo/a.py:3:1 - error: Import could not be resolved\n0 errors, 1 warning, 0 notes"

