# squeez — shipped filter-DSL rule pack.
#
# The DSL engine (src/filter_dsl.rs) could always cover the long tail that
# GenericHandler can't compress; what was missing was any content in it, so
# every user started from an empty filters.ini. This is that content.
#
# Precedence: a rule in ./.squeez/filters.ini (project) or
# ~/.claude/squeez/filters.ini (user) with the SAME section name shadows the
# built-in one. `builtin_filters = false` disables the whole pack.
#
# ── Rules for authoring here ────────────────────────────────────────────
#
# 1. Section names match by PREFIX (`cmd.starts_with(name)`), so always
#    include the trailing space or subcommand. `[filter "ps"]` would hijack
#    `psql`, which has a real handler; `[filter "ps "]` does not.
# 2. Never shadow a command that already has a dedicated handler in
#    filter.rs (git, docker, npm/pnpm/yarn, cargo, jest/vitest/pytest, tsc,
#    eslint, make/gradle/mvn, kubectl/gh/aws/gcloud/az, psql, curl, jq,
#    terraform, helm, find/ls/du/ps, grep/rg/awk/sed). A DSL rule outranks
#    every one of them.
# 3. Prefer positive matching (match_line / keep_lines_containing): it drops
#    blank lines implicitly, and it fails safe — an unrecognized output
#    shape yields little rather than yielding garbage.
# 4. Every rule carries at least one test_input/test_expect pair.
#    `squeez filter-test` runs them and CI gates on it. `\n` expands in
#    fixtures; stage patterns stay literal.
# 5. Keep an error escape hatch. A rule that can swallow a failure line
#    must carry `unless "error"` or an explicit keep for the failure shape.

# ── Python ──────────────────────────────────────────────────────────────

[filter "pip install"]
strip_ansi = true
strip_lines_containing = "Requirement already satisfied"
strip_lines_containing = "Using cached"
strip_lines_containing = "Downloading "
max_lines = 40
on_empty = "pip install: all requirements already satisfied"
test_input = "Requirement already satisfied: urllib3 in ./venv (2.0.7)\nDownloading certifi-2024.2.2-py3-none-any.whl (163 kB)\nSuccessfully installed certifi-2024.2.2"
test_expect = "Successfully installed certifi-2024.2.2"

[filter "pip3 install"]
strip_ansi = true
strip_lines_containing = "Requirement already satisfied"
strip_lines_containing = "Using cached"
strip_lines_containing = "Downloading "
max_lines = 40
on_empty = "pip3 install: all requirements already satisfied"
test_input = "Requirement already satisfied: pytest in ./venv (8.0.0)\nSuccessfully installed pytest-8.0.0"
test_expect = "Successfully installed pytest-8.0.0"

[filter "uv pip install"]
