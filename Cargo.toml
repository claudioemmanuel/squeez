[package]
name = "squeez"
version = "1.49.2"
edition = "2021"
description = "Zero-runtime-dependency token compressor for 7 AI CLI hosts (Claude Code, Copilot CLI, OpenCode, Gemini CLI, Codex CLI, Pi, Hermes). Up to 95% bash compression, reversible via squeez_retrieve, refuses net-loss compressions, cross-call dedup, signature-mode code reads, MCP server. One static binary."
repository = "https://github.com/claudioemmanuel/squeez"
license = "Apache-2.0"
keywords = ["claude-code", "token", "compression", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
autobenches = false

[[bin]]
name = "squeez"
path = "src/main.rs"

[[bin]]
name = "bench_i18n"
path = "bench/bench_i18n.rs"

[lib]
name = "squeez"
path = "src/lib.rs"

[dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
strip = true
lto = true
